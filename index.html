<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0C1018" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kintsugi" />
    <meta
      name="description"
      content="Learn Japanese kanji and vocabulary from kana to JLPT N1, one short session a day."
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kintsugi</title>
    <style>
      html {
        background: #0c1018;
        color: #eeece6;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #f3f1ea;
          color: #0c1018;
        }
      }
      html[data-theme='dark'] {
        background: #0c1018;
        color: #eeece6;
      }
      html[data-theme='light'] {
        background: #f3f1ea;
        color: #0c1018;
      }
      body {
        margin: 0;
        min-height: 100dvh;
      }
      html[data-returning] [data-prerender] {
        display: none;
      }
    </style>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('kintsugi.settings') || '{}')
        if (s.onboarded) document.documentElement.setAttribute('data-returning', '')
        var t =
          s.theme === 'dark' || s.theme === 'light'
            ? s.theme
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script data-entry="" data-preload="">
      ;(function () {
        var d = document.currentScript.dataset
        if (!d.entry) return
        function go() {
          d.preload.split(',').forEach(function (h) {
            if (!h) return
            var l = document.createElement('link')
            l.rel = 'modulepreload'
            l.crossOrigin = ''
            l.href = h
            document.head.appendChild(l)
          })
          var s = document.createElement('script')
          s.type = 'module'
          s.crossOrigin = ''
          s.src = d.entry
          document.head.appendChild(s)
        }
        requestAnimationFrame(function () {
          setTimeout(go, 0)
        })
      })()
    </script>
  </body>
</html>
